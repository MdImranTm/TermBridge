name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build Windows app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Package direct-open app folder
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/TermBridge-0.3.0-App-Folder.zip -Force

      - name: Package full project source
        shell: pwsh
        run: |
          $exclude = @('node_modules','release','.git')
          $stage = Join-Path $env:RUNNER_TEMP 'TermBridge-Project-Source'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          Compress-Archive -Path "$stage/*" -DestinationPath release/TermBridge-Project-Source.zip -Force

      - name: Show output
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, Length

      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TermBridge-Windows-v0.3.0
          path: |
            release/TermBridge-0.3.0-Setup.exe
            release/TermBridge-0.3.0-Portable.exe
            release/TermBridge-0.3.0-App-Folder.zip
            release/TermBridge-Project-Source.zip
          if-no-files-found: error
          retention-days: 30
